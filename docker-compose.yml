# استضافة كاملة بأمر واحد: المتجر + قاعدة بيانات PostgreSQL
#
#   ADMIN_PASSWORD='كلمة-مرور-قوية' POSTGRES_PASSWORD='كلمة-أخرى' docker compose up -d --build
#
# ثم افتح http://localhost:3000

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qafila
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?حدّد POSTGRES_PASSWORD}
      POSTGRES_DB: qafila
    volumes:
      - qafila_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qafila -d qafila"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://qafila:${POSTGRES_PASSWORD}@db:5432/qafila
      # كلمة مرور حساب المدير admin@qafila.store عند أول تشغيل
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?حدّد ADMIN_PASSWORD}
      # اختياري: بريد خدمة العملاء الذي يظهر في صفحة المساعدة
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
    ports:
      - "3000:3000"

volumes:
  qafila_db:
